name: backend-interview-lab

x-app: &app
  image: backend-interview-lab:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  env_file:
    - path: .env.docker
      required: false
  environment: &app-environment
    APP_ENV: local
    APP_DEBUG: "false"
    APP_URL: http://localhost:8080
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: interview_platform
    DB_USERNAME: interview_app
    DB_PASSWORD: ${DB_PASSWORD:-interview-local-only}
    CACHE_STORE: redis
    SESSION_DRIVER: database
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    ASSESSMENT_DRIVER: deterministic
    RELEASE_DIGEST: ${RELEASE_DIGEST:-local-development}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php", "artisan", "about"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: backend-interview-lab-nginx:${IMAGE_TAG:-local}
    build:
      context: .
      target: webserver
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--backoff=3", "--timeout=60", "--max-time=3600"]
    stop_grace_period: 90s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    profiles: ["operations"]

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: interview_platform
      MARIADB_USER: interview_app
      MARIADB_PASSWORD: ${DB_PASSWORD:-interview-local-only}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-only}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  database-data:
  redis-data:
